name: Site

# Builds the project site (landing page, live web demo and API reference) and deploys it to GitHub
# Pages. Called by the release workflow, and can be run on demand.

on:
  workflow_call:
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  deploy:
    name: Build and deploy the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the API reference and the web demo
        run: ./gradlew dokkaGenerate :sample:web:wasmJsBrowserDistribution
      - name: Assemble the site
        run: |
          mkdir -p site
          cp config/site/index.html config/site/logo.svg site/
          cp -r build/dokka/html site/api
          cp -r sample/web/build/dist/wasmJs/productionExecutable site/demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
