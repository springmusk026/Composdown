# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).
# Every deviation from the defaults is listed here with its reason.

config:
  validation: true

complexity:
  LongParameterList:
    # Composables take many optional parameters by design (modifier, styles, slots).
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Parser modules group many small, private, single-purpose functions per file.
    thresholdInFiles: 25
    thresholdInClasses: 25

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # CompositionLocals follow the Compose `LocalXxx` convention.
    constantPattern: '[A-Z][A-Za-z0-9]*'

style:
  MagicNumber:
    excludes: ['**/commonTest/**', '**/*Test/**', '**/test/**']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateMember:
    # Compose previews are private and referenced only by tooling.
    ignoreAnnotated: ['Preview']
