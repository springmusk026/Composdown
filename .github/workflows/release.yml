name: Release

# Publishes a release when a version tag (v0.1.0) is pushed: verifies the build, uploads signed
# artifacts to Maven Central, creates the GitHub release from the changelog, and publishes the API
# reference to GitHub Pages. See RELEASING.md.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  publish:
    name: Publish to Maven Central
    # Kotlin/Native artifacts for Apple targets are built on macOS.
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check that the tag matches the version
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Extract the release notes
        run: python3 scripts/changelog_section.py "$VERSION" > release-notes.md
      - name: Verify
        run: ./gradlew check
      - name: Publish
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "Composdown $VERSION" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  api-reference:
    name: Publish the API reference
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate
        run: ./gradlew dokkaGenerate
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/dokka/html
      - id: deploy
        uses: actions/deploy-pages@v5
