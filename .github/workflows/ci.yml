name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  lint:
    name: Lint (Spotless, detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Spotless and detekt
        run: ./gradlew spotlessCheck detekt
      - name: Upload detekt reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'

  test-jvm-android:
    name: Tests (Desktop JVM, Android host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Desktop and Android host tests
        run: ./gradlew desktopTest testAndroidHostTest
      - name: Screenshot tests (Desktop)
        run: ./gradlew verifyRoborazziDesktop
      - name: Upload test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jvm-android
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/

  test-ios-and-api:
    name: Tests (iOS simulator) and API check
    # iOS targets can only be compiled, linked and tested on macOS. KLib ABI dumps are also only
    # exact on macOS, where every Apple target can be compiled rather than inferred.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: iOS simulator tests and compile all iOS targets
        run: ./gradlew iosSimulatorArm64Test compileKotlinIosArm64 compileKotlinIosX64
      - name: API check (JVM and KLib)
        run: ./gradlew apiCheck
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ios
          path: '**/build/reports/tests/'
